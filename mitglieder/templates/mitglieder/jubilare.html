{% extends "mitglieder/index.html" %}
{% block sbcontent %}

<div class="row">

<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Name 2</th>
                <th>Email</th>
                <th>Geburtsdatum</th>
                <th>Alter</th>
            </tr>
        </thead>
        <tbody>
          {% for m in jubilare %}
            <tr>
              <td><a href="{% url 'ovgmitglieder:mitglied_details' pk=m.id %}">{{ m.id }}</a></td>
                <td>{{ m.first_name }}</td>
                <td>{{ m.last_name }}</td>
                <td>{{ m.surname2 }}</td>
                <td>{{ m.email }}</td>
                <td>{{ m.gebdat }}</td>
                <td>{{ m.alter }}</td>
            </tr>
          {% endfor %}

        </tbody>
    </table>
</div>



</div>

{% endblock sbcontent %}
