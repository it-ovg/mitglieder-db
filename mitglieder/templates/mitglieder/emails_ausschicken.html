{% extends "mitglieder/index.html" %}
{% block sbcontent %}

<div class="row">
  {% if error %}
  	<div class="alert alert-danger">
  	   {{ error }}
  	</div>
  {% endif %}

  <div class="alert alert-{% if s %}success{% else %}danger{% endif %}">
    {{ mail }}
  </div>
</div>
<div class="row">
  <a href="{% url 'ovgmitglieder:mitglied_details' pk=m.id %}">zurück zur Seite von {{ m.first_name }} {{ m.nachname }}</a>
</div>

{% endblock sbcontent %}
